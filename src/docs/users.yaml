paths:
  /users:
    get:
      tags: [Users]
      summary: Listar usuarios
      description: Devuelve todos los usuarios registrados en la base de datos.
      responses:
        '200':
          description: Usuarios encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Users]
      summary: Crear usuario
      description: Crea un usuario con los datos enviados en el body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName:
                  type: string
                  example: Ana
                lastName:
                  type: string
                  example: García
                email:
                  type: string
                  format: email
                  example: ana@example.com
                password:
                  type: string
                  example: password123
                role:
                  type: string
                  enum: [CUSTOMER, DRIVER]
                  example: CUSTOMER
                documents:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: DNI
                      reference:
                        type: string
                        example: "12345678"
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/UserAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtener usuario por id
      description: Devuelve un usuario según su identificador.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identificador MongoDB del usuario.
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Users]
      summary: Actualizar usuario
      description: Modifica los campos del usuario indicado.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identificador del usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Users]
      summary: Eliminar usuario
      description: Elimina un usuario por su identificador.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identificador del usuario.
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
