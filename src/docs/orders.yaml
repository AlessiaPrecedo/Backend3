tags:
  - name: Orders
    description: Módulo de pedidos del dominio.

paths:
  /orders:
    get:
      tags: [Orders]
      summary: Listar pedidos
      description: Devuelve todos los pedidos registrados.
      responses:
        '200':
          description: Pedidos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Obtener pedido por id
      description: Devuelve un pedido según su identificador.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Identificador del pedido.
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
